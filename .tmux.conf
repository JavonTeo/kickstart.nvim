# remember to git clone the tmux-plugins/tpm before running the conf
# # sets it so that using prefix+r resets the tmux configuration
# unbind r
# bind r source-file ~/.tmux.conf

# change the prefix for tmux (default is C-b)
# unbind C-a
# set-option -g prefix C-b
# bind-key C-b send-prefix

# act like vim
setw -g mode-keys vi
# use prefix-<h/j/k/l> to switch between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# set true colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# change keybinds for splitting windows
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# add keybind for maximizing and minimizing tmux pane
bind -r m resize-pane -Z

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

set -g mouse on

set -g @plugin 'tmux-plugins/tpm' # tpm plugin
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'jaclu/tmux-menus'

# PowerKit plugin
set -g @plugin 'fabioluciano/tmux-powerkit'

# Basic configuration
set -g @powerkit_plugins "datetime,git,memory,hostname"
set -g @powerkit_theme "ayu"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_status_position "bottom"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_edge_separator_style "honeycomb"
set -g @powerkit_elements_spacing "both"

# Using tmux themepack yellow theme
# set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
# set -g @themepack 'powerline/double/yellow'

set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
